
services:
  burger-website:
    image: IMAGE_PLACEHOLDER
    ports:
      - target: 80
        published: 88
        protocol: tcp
        mode: ingress
    networks:
      - burger-frontend
    deploy:
      replicas: 3
      update_config:
        parallelism: 1
        delay: 5s
        order: start-first
        failure_action: rollback
      rollback_config:
        parallelism: 1
        delay: 5s
        order: start-first
      restart_policy:
        condition: on-failure

networks:
  burger-frontend:
    driver: overlay
